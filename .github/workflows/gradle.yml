name: Strict mod build
on:
  push:
    branches: ['26.2', '26.3']
  pull_request:
  workflow_dispatch:
    inputs:
      include_beta:
        description: 'Also test experimental NeoForge 26.3'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test build controller
        run: python -m unittest discover -s tests -v
      - name: Build stable targets
        run: python scripts/build.py --clean
      - name: Build experimental NeoForge 26.3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_beta }}
        run: python scripts/build.py --loader NeoForge --minecraft 26.3 --include-beta --clean
      - name: Save jars, logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passable-foliage-build
          path: |
            build/*/*/*/PassableFoliageForked-*.jar
            build/**/logs/**
            build/**/reports/**
            build/**/build-info.json
            build/**/last-build.json
          if-no-files-found: error
